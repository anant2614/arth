name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,serve]"
      # Unit tests, API tests, behaviour evals and quality floors on the gold eval split.
      - run: pytest -q --durations=10

  eval-gates:
    # Full launch-gate report (3 seeds). Reported as an artifact, never blocks: several
    # gates are expected to fail until the real gold set and the teacher exist.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -m arth.evals.run --seeds 0 1 2 --out runs/eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: runs/eval/
